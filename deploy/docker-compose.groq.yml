# Optional cloud-LLM override.
# Use only after the organisation approves sending prompts/document context to Groq.
# Command:
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.groq.yml up -d --build
services:
  backend:
    environment:
      LLM_PROVIDER: groq
      ALLOW_CLOUD_PROVIDERS: "true"
      GROQ_API_KEY_FILE: /run/secrets/groq_api_key
    secrets:
      - groq_api_key

secrets:
  groq_api_key:
    file: ../secrets/groq_api_key
